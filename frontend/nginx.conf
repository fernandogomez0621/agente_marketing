server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests al backend FastAPI
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
    location /clusters {
        proxy_pass http://api:8000/clusters;
        proxy_set_header Host $host;
    }
    location /agent/ {
        proxy_pass http://api:8000/agent/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /traces {
        proxy_pass http://api:8000/traces;
        proxy_set_header Host $host;
    }

    # Frontend (fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
